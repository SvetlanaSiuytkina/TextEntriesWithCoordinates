<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Timeline</h1>
        </header>

        <div class="timeline" id="timeline">
        </div>

        <div class="input-area">
            <textarea 
                class="post-text"
                placeholder="Напишите что-нибудь..."
                rows="5">
            </textarea>
            <button class="add-post-btn">Опубликовать
            </button>
        </div>
    </div>

    <div class="modal hidden" id="manual-coords-modal">
        <div class="modal-content">
            <h2>Укажите координаты вручную</h2>
            <p>Введите широту и долготу</p>
            <input 
                type="text"
                id="manual-coords-input"
                placeholder="Например: 51.50851, -0.12572"
            />

            <div class="coords-error" id="coords-error-message" ></div>

            <div class="modal-actions">
                <button id="confirm-manual-coords" class="confirm-manual-coords">Подтвердить</button>
                <button id="cancel-manual-coords" class="cancel-manual-coords">Отмена</button>
            </div>
        </div>
    </div>
    
    <div id="error-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Ошибка</h2>
            <p id="error-message">Произошла ошибка</p>
            <button id="close-error-modal" class="close-error-modal">Закрыть</button>
        </div>
    </div>
</body>
</html>
